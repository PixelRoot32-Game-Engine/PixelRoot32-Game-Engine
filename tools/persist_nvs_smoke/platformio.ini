; Board smoke for the persistence module's NVS adapter (T6: S12, S13, S14, N3).
;
; Target: the CYD (ESP32-2432S028, classic ESP32, 4 MB) that carries DOOM. The
; panel is not used; everything is reported over serial at 115200.
;
;   pio run  -e smoke -t upload          # S13, type replacement, timings, stats
;   pio test -e smoke                    # the shared contract suite on the board
;   pio run  -e smoke_nostores           # N3 baseline: same image, no store linked
;
; The board keeps DOOM's partition table (partitions_wad.csv, a copy) and the
; upload skips the 0xE000 boot_app0 image (keep_nvs.py), so neither the `wad`
; container nor the `nvs` partition is moved or overwritten. Nothing here
; erases flash or the NVS partition; the firmware writes only to its own
; namespaces (pr32pref, pr32smk; pr32ctk/pr32cts for the contract suite).

[platformio]
default_envs = smoke
; `pio test` runs the engine's own suite, unchanged: the contract file is the
; one the native envs run (S14).
test_dir = ../../test

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
test_speed = 115200
board_build.partitions = partitions_wad.csv
extra_scripts = post:keep_nvs.py
build_unflags = -std=gnu++11
; The DOOM CYD build's code-generation flags (games/doom lib/platformio.ini),
; with the persistence module on.
build_flags =
    -std=gnu++17
    -Os
    -fno-exceptions
    -fno-rtti
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -D PIXELROOT32_ENABLE_PERSISTENCE=1
; The engine from this tree. Its other dependencies come from library.json.
lib_deps =
    symlink://../..
test_filter = unit/test_persist_contract
test_build_src = no

[env:smoke]
build_flags = ${env.build_flags} -D PERSIST_SMOKE_LINK_STORES=1

; N3 baseline: the same firmware with every Esp32Nvs* call compiled out. The
; .data + .bss difference against [env:smoke] is the adapter's static RAM.
[env:smoke_nostores]
build_flags = ${env.build_flags} -D PERSIST_SMOKE_LINK_STORES=0
