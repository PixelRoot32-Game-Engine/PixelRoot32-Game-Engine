; Board smoke for the persistence module's microSD adapter (T2: S3, S4, S5, S6).
;
; Target: the CYD (ESP32-2432S028, classic ESP32, 4 MB), whose microSD reader
; is on SPI/VSPI: CS=5, SCK=18, MISO=19, MOSI=23. Insert a FAT32 card. The
; panel is not used; everything is reported over serial at 115200.
;
;   pio test -e smoke --upload-port COM4 --test-port COM4   # contract suite on the card
;   pio run  -e smoke -t upload --upload-port COM4          # serial report: mount + round trip
;   pio test -e smoke --without-testing                     # build the test firmware only
;
; Nothing here reformats or erases the card: the adapter mounts it, creates the
; `/pr32smk/s` directory and writes only `0.slot`, `1.slot`, `2.slot` there.

[platformio]
default_envs = smoke
; `pio test` runs the engine's own suite, unchanged: the contract file is the
; one the native envs run.
test_dir = ../../test

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
test_speed = 115200
build_unflags = -std=gnu++11
; The engine's ESP32 build flags, with persistence and the SD backend on.
build_flags =
    -std=gnu++17
    -Os
    -fno-exceptions
    -fno-rtti
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -D PIXELROOT32_ENABLE_PERSISTENCE=1
    -D PIXELROOT32_ENABLE_SD_STORAGE=1
; The engine from this tree. Its other dependencies come from library.json.
lib_deps =
    symlink://../..
test_filter = unit/test_persist_contract
; The contract suite lives in ../../test; src/main.cpp is the serial report.
test_build_src = no

[env:smoke]
