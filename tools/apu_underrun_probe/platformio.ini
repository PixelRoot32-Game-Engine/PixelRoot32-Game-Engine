; Underrun gate harness for the E0 acceptance (S15.6).
;
; Drives a real ESP32 I2S backend for RUN_SECONDS with eight voices and reports
; the backend's own counters. It is not a benchmark: the CPU baseline comes from
; PixelRoot32-APU's tools/apu_bench_firmware.
;
;   pio run -e smoke            -t upload   # 30 s sanity run
;   pio run -e esp32dev_22050   -t upload   # 10 min gate at 22 050 Hz
;   pio run -e esp32dev_32000   -t upload   # 10 min gate at 32 000 Hz

[platformio]
default_envs = smoke

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -Os -std=gnu++17
; The engine from this tree, and the APU branch it is being developed against.
lib_deps =
    symlink://../..
    symlink://C:/Users/Gperez/Documents/Projects/pr32-workspace/PixelRoot32-APU

[env:smoke]
board = esp32dev
build_flags = ${env.build_flags} -DRUN_SAMPLE_RATE=22050 -DRUN_SECONDS=30

[env:esp32dev_22050]
board = esp32dev
build_flags = ${env.build_flags} -DRUN_SAMPLE_RATE=22050 -DRUN_SECONDS=600

[env:esp32dev_32000]
board = esp32dev
build_flags = ${env.build_flags} -DRUN_SAMPLE_RATE=32000 -DRUN_SECONDS=600

[env:esp32c3_22050]
board = esp32-c3-devkitm-1
; This board is reached through the chip's native USB, and the Arduino core for
; esp32-c3-devkitm-1 routes Serial to UART0 by default. Without these two flags
; the run happens and nothing reaches the monitor.
build_flags = ${env.build_flags} -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DRUN_SAMPLE_RATE=22050 -DRUN_SECONDS=600

[env:esp32c3_32000]
board = esp32-c3-devkitm-1
build_flags = ${env.build_flags} -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DRUN_SAMPLE_RATE=32000 -DRUN_SECONDS=600

[env:esp32c3_smoke]
board = esp32-c3-devkitm-1
build_flags = ${env.build_flags} -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1 -DRUN_SAMPLE_RATE=22050 -DRUN_SECONDS=30
