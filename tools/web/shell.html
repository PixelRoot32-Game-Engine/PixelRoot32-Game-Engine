<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PixelRoot32 example</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; }
      body {
        background: #0e1014;
        color: #e8e6e1;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      nav {
        display: flex;
        align-items: baseline;
        gap: .6rem;
        padding: .7rem 1.1rem;
        border-bottom: 1px solid #272c36;
        font-size: .85rem;
      }
      nav a { color: #f0b429; text-decoration: none; }
      nav a:hover, nav a:focus-visible { text-decoration: underline; }
      nav .sep { color: #4b5361; }
      nav .where { color: #9aa3b2; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      /* Block layout, not flex: a flex container re-opens the canvas sizing
         loop described below (measured: it collapses to 6x6 again). */
      main { padding: 1rem; text-align: center; }
      /* The size here is not decoration: Emscripten's SDL reads the canvas's
         CSS box back as the window size, so the stylesheet and the window size
         are one loop. A `max-width: 100%` on the canvas drives that loop down to
         a few pixels (measured: 6x6), and `height: auto` alone shrinks it to the
         logical resolution. One explicit dimension, aspect from the canvas
         itself, is the combination that holds. */
      canvas {
        display: block;
        margin: 0 auto;
        border: 1px solid #272c36;
        background: #000;
        height: min(85vmin, 720px);
        width: auto;
        image-rendering: pixelated;
      }
      #status { color: #9aa3b2; font-size: .8rem; min-height: 1em; margin: .6rem 0; }
      #progress { width: 12rem; }
      #spinner {
        margin: 0 auto .4rem;
        width: .55rem;
        height: .55rem;
        border-radius: 50%;
        background: #f0b429;
        animation: pulse 1s ease-in-out infinite alternate;
      }
      @keyframes pulse { from { opacity: .25; } to { opacity: 1; } }
      /* The runtime's stdout log: kept because the glue writes to it, hidden
         because a published demo is not a terminal. */
      #output { display: none; }
    </style>
  </head>
  <body>
    <nav>
      <a href="index.html">&larr; All demos</a>
      <span class="sep">/</span>
      <span class="where" id="where">PixelRoot32</span>
    </nav>

    <main>
      <div id="spinner"></div>
      <div id="status">Downloading&hellip;</div>
      <progress value="0" max="100" id="progress" hidden></progress>
      <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    </main>

    <textarea id="output" rows="4"></textarea>

    <script type="text/javascript">
      // The same contract as Emscripten's default shell (which this replaces):
      // define `Module` before the glue runs, hand it the canvas, and route the
      // runtime's status through the elements above. The logo, the "powered by
      // emscripten" banner and the pointer-lock/resize controls were debugging
      // aids for a compiler demo, not for an engine example.
      var statusElement = document.getElementById('status');
      var progressElement = document.getElementById('progress');
      var spinnerElement = document.getElementById('spinner');
      var canvasElement = document.getElementById('canvas');
      var outputElement = document.getElementById('output');
      if (outputElement) outputElement.value = ''; // clear browser cache

      // The page name comes from the file that was opened, so one shell serves
      // every demo and the gallery's neighbour is named without a build step.
      var page = location.pathname.split('/').pop().replace(/\.html?$/, '');
      if (page) document.getElementById('where').textContent = page;

      canvasElement.addEventListener('webglcontextlost', function (event) {
        alert('WebGL context lost. You will need to reload the page.');
        event.preventDefault();
      }, false);

      var setStatus = function (text) {
        if (!setStatus.last) setStatus.last = { time: Date.now(), text: '' };
        if (text === setStatus.last.text) return;
        var match = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
        var now = Date.now();
        // A progress update that arrives within 30 ms of the previous one is
        // not news; skipping it keeps the status line readable.
        if (match && now - setStatus.last.time < 30) return;
        setStatus.last.time = now;
        setStatus.last.text = text;
        if (match) {
          progressElement.value = parseInt(match[2]) * 100;
          progressElement.max = parseInt(match[4]) * 100;
          progressElement.hidden = false;
          spinnerElement.hidden = false;
        } else {
          progressElement.value = null;
          progressElement.max = null;
          progressElement.hidden = true;
          if (!text) spinnerElement.style.display = 'none';
        }
        statusElement.innerHTML = text;
      };

      var Module = {
        print: function () {
          console.log.apply(console, arguments);
          if (outputElement) {
            outputElement.value += Array.prototype.join.call(arguments, ' ') + '\n';
            outputElement.scrollTop = outputElement.scrollHeight;
          }
        },
        canvas: canvasElement,
        setStatus: setStatus,
        totalDependencies: 0,
        monitorRunDependencies: function (left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          setStatus(left
            ? 'Preparing... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')'
            : 'All downloads complete.');
        }
      };
      setStatus('Downloading...');
      window.onerror = window.onunhandledrejection = function () {
        setStatus('Exception thrown, see JavaScript console');
        spinnerElement.style.display = 'none';
        setStatus = function (text) {
          if (text) console.error('[post-exception status] ' + text);
        };
      };
    </script>
    {{{ SCRIPT }}}
  </body>
</html>
