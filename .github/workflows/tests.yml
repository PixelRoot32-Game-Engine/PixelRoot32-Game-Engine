name: PixelRoot32 CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test_native:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Cache PlatformIO
      uses: actions/cache@v4
      with:
        # Toolchains and platform packages only, like `examples.yml`. `.pio`
        # holds build outputs and gcov data: caching it restored stale `.gcda`
        # files from the previous runner image (Ubuntu 26.04 ships GCC 15), so
        # `lcov --capture` failed with "stamp mismatch" after the tests passed.
        # The key prefix is bumped to `pio-v2` so entries saved with `.pio`
        # inside are never restored again.
        path: ~/.platformio
        key: ${{ runner.os }}-pio-v2-${{ hashFiles('**/platformio.ini') }}
        restore-keys: |
          ${{ runner.os }}-pio-v2-

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        sudo apt-get update
        sudo apt-get install -y libsdl2-dev lcov bc

    - name: Run Tests
      run: |
        pio test -e native_test --verbose

    # Separate step, not appended to the one above, so a failure names which
    # configuration broke. The env above proves the gameplay flags stay
    # behavior-inert when off; this one is the only place their functional
    # assertions actually run.
    - name: Run Tests (gameplay flags enabled)
      run: |
        pio test -e native_test_gameplay --verbose

    # Separate step for the same reason: native_test proves the rest
    # threshold stays behavior-inert at its 0 default, while this env is the
    # only place the snap-to-rest assertions actually run (issue #246).
    - name: Run Tests (physics rest threshold set)
      run: |
        pio test -e native_test_physics_rest --verbose

    # Separate step for the same reason: native_test proves the networking
    # flag stays behavior-inert when off, while this environment is the only
    # one where the networking assertions actually run.
    - name: Run Tests (networking enabled)
      run: |
        pio test -e native_test_networking --verbose

    # Separate step for the same reason: native_test proves the persistence
    # flag stays behavior-inert when off, while this environment is the only
    # one where the persistence assertions actually run.
    - name: Run Tests (persistence enabled)
      run: |
        pio test -e native_test_persistence --verbose

    # Issue #273: the native SDL2 teardown suite initialises and quits SDL
    # itself, so it owns its process instead of sharing native_test's binary.
    # Headless by construction: the suite selects SDL's dummy drivers.
    - name: Run Tests (native SDL2 teardown)
      run: |
        pio test -e native_test_sdl_teardown --verbose

    - name: Generate Coverage Report
      run: |
        # `inconsistent` is suppressed on every lcov/genhtml call: a test file may
        # define the same function in both branches of an #if/#else (only one is
        # compiled, so the build is fine), and lcov 2.x with GCC 15 reports the two
        # source sites as a duplicate definition, or a function/line mismatch, and
        # exits 1. The classes are gcov quirks, not coverage data problems.
        lcov --capture --directory . --output-file coverage.info --ignore-errors inconsistent
        lcov --remove coverage.info '/usr/*' '*/.pio/*' '*/test/*' '*/drivers/native/*' '*/drivers/esp32/*' '*/src/core/Engine.cpp' '*/src/graphics/Renderer.cpp' '*/src/physics/TileConsumptionHelper.cpp' '*/include/graphics/BaseDrawSurface.h' '*/include/graphics/DrawSurface.h' '*/include/graphics/ui/UICheckbox.h' '*/include/core/Scene.h' --output-file coverage.info --ignore-errors inconsistent,unused
        lcov --list coverage.info --ignore-errors inconsistent
        genhtml coverage.info --output-directory coverage_report --ignore-errors inconsistent

    - name: Verify Coverage Threshold
      run: |
        TOTAL=$(lcov --summary coverage.info --ignore-errors inconsistent 2>/dev/null | grep "lines" | awk '{print $2}' | sed 's/%//')
        echo "Line coverage: $TOTAL%"
        if (( $(echo "$TOTAL < 80" | bc -l) )); then
          echo "ERROR: Line coverage $TOTAL% is below 80% threshold"
          exit 1
        fi
        echo "Coverage check passed!"

    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage_report/
