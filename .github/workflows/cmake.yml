name: cmake

# `install()` and `find_package()` are claims about a prefix, not about a build
# directory, and a claim nobody configures rots fast: the header list, the
# export set and the APU headers a consumer needs are exactly the kind of thing
# that keeps working on the machine where it was written.
#
# This job answers that on a clean runner: configure, build, install into an
# empty prefix, then build a project that lives outside the engine's tree and
# whose only input is `CMAKE_PREFIX_PATH`. It deliberately does not run a game —
# the consumer never calls Engine::init(), so no window is opened and no SDL
# video driver is needed.
#
# It also builds a second time with flags switched off, which is the half a
# default build cannot check: `PIXELROOT32_ENABLE_*` values have to reach the
# exported interface (a consumer compiles the same branches as the library) and
# a default configure has to emit no macros at all, so the headers stay the
# single place that decides what "default" means.
#
# The `package_*` jobs take the installed package one step further: they build
# `examples/sprites` against it and check the desktop artifact that comes out —
# a `.app` bundle on macOS, an AppImage on Linux. Both are opened without a
# display (`SDL_VIDEODRIVER=dummy`) and have to stay alive for three seconds,
# which is the difference between "the file exists" and "the game came up".
#
# Windows is absent on purpose: `native-multiplatform.yml` covers the PlatformIO
# build there, and the CMake path would need the same SDL2 MinGW tarball dance
# plus a MinGW generator choice. That is also why there is no Windows installer
# yet: an installer for a build nobody has run is a worse artifact than a
# documented gap. See docs/guide/packaging.md.
#
# TRACKER BRANCH — same note as the other workflows: feat/sdl2-multiplatform is
# the long-lived tracker, chained pull requests target it, and nothing reaches
# develop until the port lands. Remove it from both filters in the pull request
# that merges the tracker into develop.

on:
  push:
    branches: [main, develop, feat/sdl2-multiplatform]
  pull_request:
    branches: [main, develop, feat/sdl2-multiplatform]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  install_and_consume:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      # The engine resolves SDL2 through its CMake config package, which both
      # the distribution package and Homebrew ship.
      - name: Install SDL2
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install sdl2
          else
            sudo apt-get update
            sudo apt-get install -y libsdl2-dev
          fi

      - name: Configure, build and install
        run: |
          cmake -S . -B build/cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/build/prefix"
          cmake --build build/cmake --parallel
          cmake --install build/cmake

      # Everything a consumer needs, and nothing a consumer must not get.
      - name: The installed tree is complete
        run: |
          set -eu
          prefix=build/prefix
          for file in \
            lib/cmake/PixelRoot32/PixelRoot32Config.cmake \
            lib/cmake/PixelRoot32/PixelRoot32ConfigVersion.cmake \
            lib/cmake/PixelRoot32/PixelRoot32Targets.cmake \
            include/core/Engine.h \
            include/platforms/EngineConfig.h \
            include/pixelroot32/apu/ApuCore.h
          do
            test -f "$prefix/$file" || { echo "::error::missing $file in the install tree"; exit 1; }
          done
          if [ -d "$prefix/include/test" ]; then
            echo "::error::the unit-test harness headers were installed; include/test is not API"
            exit 1
          fi
          for lib in libPixelRoot32.a; do
            test -f "$prefix/lib/$lib" || { echo "::error::missing $lib"; exit 1; }
          done

      # The acceptance test: a separate project, a separate build directory, no
      # source path in common with this checkout.
      - name: Build the out-of-tree consumer
        run: |
          cmake -S tools/cmake_consumer -B build/consumer \
            -DCMAKE_PREFIX_PATH="$PWD/build/prefix"
          cmake --build build/consumer --parallel

      - name: Run the consumer
        run: |
          set -eu
          output=$(./build/consumer/pr32_cmake_consumer)
          echo "$output"
          echo "$output" | grep -q "via find_package" || { echo "::error::the consumer did not report the package version"; exit 1; }
          echo "$output" | grep -q "sdl2 linked" || { echo "::error::SDL2 did not arrive through the package"; exit 1; }

      # Flags off is the configuration the default build cannot reach: it proves
      # the engine still builds without audio/physics/UI, and that the choice is
      # visible in the export rather than only in the library.
      - name: A non-default configure reaches the package
        run: |
          set -eu
          cmake -S . -B build/cmake-off \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/build/prefix-off" \
            -DPIXELROOT32_ENABLE_AUDIO=OFF \
            -DPIXELROOT32_ENABLE_PHYSICS=OFF \
            -DPIXELROOT32_ENABLE_UI_SYSTEM=OFF \
            -DPIXELROOT32_ENABLE_PARTICLES=OFF \
            -DPIXELROOT32_ENABLE_PERSISTENCE=ON
          cmake --build build/cmake-off --parallel
          cmake --install build/cmake-off

          off=build/prefix-off/lib/cmake/PixelRoot32/PixelRoot32Targets.cmake
          grep -q 'PIXELROOT32_ENABLE_AUDIO=0' "$off" || { echo "::error::PIXELROOT32_ENABLE_AUDIO=0 did not reach the exported interface"; exit 1; }
          grep -q 'PIXELROOT32_ENABLE_PHYSICS=0' "$off" || { echo "::error::PIXELROOT32_ENABLE_PHYSICS=0 did not reach the exported interface"; exit 1; }
          grep -q 'PIXELROOT32_ENABLE_PERSISTENCE=1' "$off" || { echo "::error::PIXELROOT32_ENABLE_PERSISTENCE=1 did not reach the exported interface"; exit 1; }

      # And the other direction: a default configure must emit no flag at all,
      # so a new default in the headers is never shadowed by a stale copy here.
      - name: A default configure emits no flag macros
        run: |
          set -eu
          targets=build/prefix/lib/cmake/PixelRoot32/PixelRoot32Targets.cmake
          if grep -q 'PIXELROOT32_ENABLE_' "$targets"; then
            echo "::error::a default configure exported PIXELROOT32_ENABLE_* macros; only non-default values may be emitted"
            grep 'PIXELROOT32_ENABLE_' "$targets"
            exit 1
          fi
          grep -q 'PLATFORM_NATIVE' "$targets" || { echo "::error::PLATFORM_NATIVE is not exported"; exit 1; }

  # The flags `examples/sprites/lib/platformio.ini` passes, as CMake options.
  # The engine is compiled with them and the exported interface hands the same
  # macros to the game, so both halves of a package build agree.
  package_macos:
    runs-on: macos-latest
    env:
      PR32_SPRITES_FLAGS: >-
        -DPIXELROOT32_ENABLE_2BPP_SPRITES=ON
        -DPIXELROOT32_ENABLE_4BPP_SPRITES=ON
        -DPIXELROOT32_ENABLE_AUDIO=OFF
        -DPIXELROOT32_ENABLE_PHYSICS=OFF
        -DPIXELROOT32_ENABLE_UI_SYSTEM=OFF
        -DPIXELROOT32_ENABLE_PARTICLES=OFF

    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2
        run: brew install sdl2

      - name: Build and install the engine
        run: |
          cmake -S . -B build/cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/build/prefix" \
            $PR32_SPRITES_FLAGS
          cmake --build build/cmake --parallel
          cmake --install build/cmake

      - name: Build the packaged game
        run: |
          cmake -S tools/desktop_package -B build/package \
            -DCMAKE_PREFIX_PATH="$PWD/build/prefix"
          cmake --build build/package --parallel

      # A `.app` is a directory layout plus an Info.plist; both are claims the
      # build makes, and both are checked here rather than trusted.
      - name: The bundle is a bundle
        run: |
          set -eu
          app=build/package/pr32_sprites_demo.app
          binary="$app/Contents/MacOS/pr32_sprites_demo"
          test -x "$binary" || { echo "::error::the bundle has no executable"; exit 1; }
          test -f "$app/Contents/Info.plist" || { echo "::error::the bundle has no Info.plist"; exit 1; }
          plutil -lint "$app/Contents/Info.plist"
          plist=$(plutil -p "$app/Contents/Info.plist")
          echo "$plist"
          for key in 'CFBundleExecutable' 'CFBundleIdentifier' 'NSHighResolutionCapable' 'NSPrincipalClass'; do
            echo "$plist" | grep -q "\"$key\"" || { echo "::error::$key is missing from Info.plist"; exit 1; }
          done
          echo "$plist" | grep -q 'org.pixelroot32.pr32_sprites_demo' || { echo "::error::unexpected bundle identifier"; exit 1; }
          file "$binary" | grep -q 'Mach-O' || { echo "::error::the bundle payload is not a Mach-O executable"; exit 1; }
          otool -L "$binary" | grep -qi sdl2 || { echo "::error::the game does not link SDL2"; exit 1; }

      # The engine's assets are compiled in, so a bundle that comes up needs no
      # working directory and no data files; a dummy video driver is enough to
      # prove the binary initialises and keeps running.
      - name: The bundle runs
        run: |
          set -eu
          binary=build/package/pr32_sprites_demo.app/Contents/MacOS/pr32_sprites_demo
          SDL_VIDEODRIVER=dummy "$binary" > package-run.log 2>&1 &
          pid=$!
          sleep 3
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::the bundle exited within 3 s"
            cat package-run.log
            exit 1
          fi
          kill "$pid"
          wait "$pid" 2>/dev/null || true
          echo "::notice::the .app bundle ran for 3 s with no display"

  package_appimage:
    runs-on: ubuntu-latest
    env:
      PR32_SPRITES_FLAGS: >-
        -DPIXELROOT32_ENABLE_2BPP_SPRITES=ON
        -DPIXELROOT32_ENABLE_4BPP_SPRITES=ON
        -DPIXELROOT32_ENABLE_AUDIO=OFF
        -DPIXELROOT32_ENABLE_PHYSICS=OFF
        -DPIXELROOT32_ENABLE_UI_SYSTEM=OFF
        -DPIXELROOT32_ENABLE_PARTICLES=OFF

    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2 and objdump
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev file

      # appimagetool is not vendored and not packaged by any distribution: the
      # continuous build per architecture is what the AppImage project ships.
      # It is itself an AppImage, and runners have no FUSE 2, so the script
      # invokes it with `--appimage-extract-and-run`.
      - name: Fetch appimagetool
        run: |
          set -eu
          arch=$(uname -m)
          curl -fsSL -o "$RUNNER_TEMP/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${arch}.AppImage"
          chmod +x "$RUNNER_TEMP/appimagetool"

      - name: Build and install the engine
        run: |
          cmake -S . -B build/cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/build/prefix" \
            $PR32_SPRITES_FLAGS
          cmake --build build/cmake --parallel
          cmake --install build/cmake

      - name: Package the game as an AppImage
        run: |
          cmake -S tools/desktop_package -B build/package \
            -DCMAKE_PREFIX_PATH="$PWD/build/prefix" \
            -DPIXELROOT32_APPIMAGETOOL="$RUNNER_TEMP/appimagetool"
          cmake --build build/package --parallel
          cmake --build build/package --target pr32_sprites_demo_appimage

      # What makes an AppImage portable is the AppDir it carries: the entry
      # point, the desktop file and the SDL2 runtime it does not get from the
      # host.
      - name: The AppImage carries what it needs
        run: |
          set -eu
          appimage=build/package/pr32_sprites_demo.AppImage
          test -x "$appimage" || { echo "::error::no AppImage was produced"; exit 1; }
          ls -l "$appimage"
          ( cd build/package && ./pr32_sprites_demo.AppImage --appimage-extract > /dev/null )
          root=build/package/squashfs-root
          for file in AppRun .DirIcon pr32_sprites_demo.desktop pr32_sprites_demo.png \
                      usr/bin/pr32_sprites_demo usr/lib/libSDL2-2.0.so.0 \
                      usr/share/applications/pr32_sprites_demo.desktop; do
            test -e "$root/$file" || { echo "::error::the AppImage is missing $file"; exit 1; }
          done
          file "$root/usr/bin/pr32_sprites_demo" | grep -q 'ELF 64-bit' || { echo "::error::the payload is not an ELF executable"; exit 1; }
          LD_LIBRARY_PATH="$root/usr/lib" ldd "$root/usr/bin/pr32_sprites_demo" \
            | grep -q "$root/usr/lib/libSDL2" || { echo "::error::the game resolves SDL2 from the host instead of the AppImage"; exit 1; }

      - name: The AppImage runs
        run: |
          set -eu
          SDL_VIDEODRIVER=dummy build/package/squashfs-root/AppRun > package-run.log 2>&1 &
          pid=$!
          sleep 3
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::the AppImage exited within 3 s"
            cat package-run.log
            exit 1
          fi
          kill "$pid"
          wait "$pid" 2>/dev/null || true
          echo "::notice::the AppImage ran for 3 s with no display"
