; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; TEMPLATES

[base]
build_unflags = 
	-std=gnu++11        ; Remove C++11 standard flag (we use C++17 instead)
build_flags =
    -Wl,--gc-sections
	-std=gnu++17        ; Use GNU C++17 standard
    -fno-exceptions     ; Saves ~15KB Flash (Removes try/catch overhead)

[base_esp32]
platform = espressif32
monitor_speed = 115200
build_unflags = 
	${base.build_unflags}
build_flags =
    ${base.build_flags}
    -Os                  ; Optimize for binary size (useful on ESP32 with limited RAM/Flash)
    -flto                ; Link-Time Optimization (reduces binary size by combining code)
    -fuse-linker-plugin  ; Allows ld to use the LTO plugin; required for RISC-V toolchain
    -ffunction-sections  ; Put each function in its own section; helps remove unused functions (-Wl,--gc-sections)
    -fdata-sections      ; Same as above but for data; helps reduce flash usage
    -fno-lto             ; Disable LTO for problematic objects; prevents "plugin needed to handle lto object" in mixed C/C++ code
    -fno-rtti            ; Remove RTTI support; saves ~20 KB of Flash and RAM
	
    ; Reduced spatial and physics grid sizes for ESP32
	-D SPATIAL_GRID_MAX_STATIC_PER_CELL=4
	-D SPATIAL_GRID_MAX_DYNAMIC_PER_CELL=4
	-D PHYSICS_MAX_CONTACTS=64
	-D PHYSICS_MAX_PAIRS=64

[base_native]
platform = native
build_unflags = 
	${base.build_unflags}
	; Apple ld does not support GNU --gc-sections (use -dead_strip instead)
	; -Wl,--gc-sections
build_flags =
    ${base.build_flags}
    -DPLATFORM_NATIVE
    -DSDL_MAIN_HANDLED
    -lSDL2
    ; -Wl,-dead_strip

; MOTOR PROFILES

[profile_full]
build_flags =
    -D PIXELROOT32_ENABLE_AUDIO=1
    -D PIXELROOT32_ENABLE_PHYSICS=1
    -D PIXELROOT32_ENABLE_PARTICLES=1
    -D PIXELROOT32_ENABLE_UI_SYSTEM=1
    -D PIXELROOT32_ENABLE_SCENE_TRANSITIONS=1
    ; Physics timestep fix
    -D PIXELROOT32_VELOCITY_DAMPING=0.999
    -D PIXELROOT32_MAX_VELOCITY=500

[profile_arcade]
build_flags =
    -D PIXELROOT32_ENABLE_AUDIO=1
    -D PIXELROOT32_ENABLE_PHYSICS=1
    -D PIXELROOT32_ENABLE_PARTICLES=1
    -D PIXELROOT32_ENABLE_UI_SYSTEM=0
    -D PIXELROOT32_ENABLE_SCENE_TRANSITIONS=1
    ; Physics timestep fix (Phase 2-3)
    -D PIXELROOT32_VELOCITY_DAMPING=0.999
    -D PIXELROOT32_MAX_VELOCITY=500

[profile_puzzle]
build_flags =
    -D PIXELROOT32_ENABLE_AUDIO=1
    -D PIXELROOT32_ENABLE_PHYSICS=0
    -D PIXELROOT32_ENABLE_PARTICLES=0
    -D PIXELROOT32_ENABLE_UI_SYSTEM=1
    -D PIXELROOT32_ENABLE_SCENE_TRANSITIONS=1

[profile_retro]
build_flags =
    -D PIXELROOT32_ENABLE_AUDIO=0
    -D PIXELROOT32_ENABLE_PHYSICS=0
    -D PIXELROOT32_ENABLE_PARTICLES=0
    -D PIXELROOT32_ENABLE_UI_SYSTEM=0

; TESTS

[env:native_test]
extends = base_native
;extra_scripts = pre:fix_env.py
test_framework = unity
test_build_src = true
; Shared APU core from the PlatformIO Registry (CI-safe; no workspace layout
; assumptions). For live local iteration against a checkout, temporarily
; replace with symlink://<path-to>/PixelRoot32-APU.
lib_deps =
	gperez88/PixelRoot32-APU@^1.0.1
; Stable integration suites run in CI. Performance/ESP32 thresholds: run manually with -f.
test_filter = unit/*, test_player_jump_integration, test_background_palette_render_integration, test_engine_integration, test_tile_collection_integration, test_user_data_integration, test_game_loop
test_ignore = test_tile_performance_integration, test_user_data_esp32_performance
build_flags = 
	${base_native.build_flags}
	-DUNIT_TEST
	-D PIXELROOT32_ENABLE_AUDIO=1
	-D PIXELROOT32_TESTING
	-Iinclude
	-Isrc/platforms/mock
	-D PIXELROOT32_ENABLE_2BPP_SPRITES
	-D PIXELROOT32_ENABLE_4BPP_SPRITES
    -D PIXELROOT32_DEBUG_MODE
    -D PIXELROOT32_ENABLE_PARTICLES=1
    -D PIXELROOT32_ENABLE_UI_SYSTEM=1
    -D PIXELROOT32_ENABLE_STATIC_TILEMAP_FB_CACHE=1
    -D PIXELROOT32_ENABLE_DIRTY_REGIONS=1
    -D PIXELROOT32_ENABLE_CAMERA_EFFECTS=1
    -D PIXELROOT32_ENABLE_SCENE_TRANSITIONS=1
	--coverage
	-lgcov

; Same suites as [env:native_test], but with every gameplay-framework flag
; enabled. Keep the two envs separate and both in CI: native_test proves the
; flags-off contract (no behavior change for existing examples), while this env
; is the only place the gameplay capabilities' functional assertions actually
; execute. Without it their test files compile only their #else stub branch and
; the suites pass without asserting anything.
[env:native_test_gameplay]
extends = env:native_test
build_flags =
	${env:native_test.build_flags}
	-D PIXELROOT32_ENABLE_GAMEPLAY_EVENTS=1
	-D PIXELROOT32_ENABLE_INTERACTION_TRIGGERS=1
	-D PIXELROOT32_ENABLE_SPATIAL_QUERY=1
	-D PIXELROOT32_ENABLE_DEPTH_SORT=1
	-D PIXELROOT32_ENABLE_GAMEPLAY_STATE_MACHINE=1
	-D PIXELROOT32_ENABLE_GAMEPLAY_OBJECT_POOL=1
	-D PIXELROOT32_ENABLE_GAMEPLAY_GRID_SPACE=1

; SIMULATOR TARGETS

[native_full]
extends = base_native, profile_full
build_flags =
    ${base_native.build_flags}
    ${profile_full.build_flags}

[native_arcade]
extends = base_native, profile_arcade
build_flags =
    ${base_native.build_flags}
    ${profile_arcade.build_flags}

[native_puzzle]
extends = base_native, profile_puzzle
build_flags =
    ${base_native.build_flags}
    ${profile_puzzle.build_flags}

[native_retro]
extends = base_native, profile_retro
build_flags =
    ${base_native.build_flags}
    ${profile_retro.build_flags}

; HARDWARE TARGETS

[esp32_full]
extends =base_esp32, profile_full
build_flags =
    ${base_esp32.build_flags}
    ${profile_full.build_flags}

[esp32_arcade]
extends =base_esp32, profile_arcade
build_flags =
    ${base_esp32.build_flags}
    ${profile_arcade.build_flags}

[esp32_puzzle]
extends =base_esp32, profile_puzzle
build_flags =
    ${base_esp32.build_flags}
    ${profile_puzzle.build_flags}

[esp32_retro]
extends =base_esp32, profile_retro
build_flags =
    ${base_esp32.build_flags}
    ${profile_retro.build_flags}