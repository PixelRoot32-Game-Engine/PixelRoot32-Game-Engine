; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = native
extra_configs = lib/platformio.ini

; The four geometry defines below are the second lesson of this example.
; The SSD1306 controller is wired for a 128x64 framebuffer, but the 0.42"
; panel on the Beetle only exposes a 72x40 window into it, starting at
; (28, 24). The engine draws in LOGICAL_* coordinates and the driver applies
; the offset; get X_OFF_SET / Y_OFF_SET wrong and the image is silently
; cropped rather than reported as an error.
;
; native uses the same numbers so the two targets agree on geometry. It is
; not a monochrome backend — see the README for what native does and does
; not reproduce.

[env:native]
extends = base_native
lib_deps =
	symlink://../../
build_flags =
    ${base_native.build_flags}
	-D PHYSICAL_DISPLAY_WIDTH=128
	-D PHYSICAL_DISPLAY_HEIGHT=64
	-D X_OFF_SET=28
	-D Y_OFF_SET=24
	-D LOGICAL_WIDTH=72
	-D LOGICAL_HEIGHT=40
    -Isrc
    -Iinclude
    -I.pio/libdeps/native/PixelRoot32-Game-Engine/include
    -I.pio/libdeps/native/PixelRoot32-Game-Engine/src
    ; macOS (Homebrew): #include <SDL2/SDL.h> needs the parent include dir
    ; -I/opt/homebrew/include
    ; -L/opt/homebrew/lib
    ; Windows (MSYS2/MinGW) — uncomment on Windows, comment macOS flags above:
    -IC:/msys64/mingw64/include
    -LC:/msys64/mingw64/lib
    -O2
    -Wall
    -Wextra
    -mconsole

[env:esp32c3]
extends = base_esp32
board = dfrobot_beetle_esp32c3
framework = arduino
lib_deps =
	symlink://../../
build_flags =
	${base_esp32.build_flags}
	-O2
	-Isrc
	-D PLATFORM_ESP32C3
	; Selects U8G2_Drawer over the default TFT_eSPI path. This one flag is
	; the whole driver choice: PlatformDefaults.h reads it and defines
	; PIXELROOT32_USE_U8G2_DRIVER, and its #else branch — the only thing
	; that would have defined PIXELROOT32_USE_TFT_ESPI_DRIVER — is skipped.
	;
	; Other examples add -D PIXELROOT32_NO_TFT_ESPI alongside this. It is
	; redundant: that macro is read in exactly one place, inside the #else
	; this flag already skips. Measured on a clean build of this example,
	; with and without it: 272,664 bytes flash and 16,336 bytes RAM either
	; way, and PlatformIO's dependency finder compiles the same three
	; TFT_eSPI sources in both cases — nothing references them, so
	; -Wl,--gc-sections drops them at link.
	-D PIXELROOT32_USE_U8G2
	-D PHYSICAL_DISPLAY_WIDTH=128
	-D PHYSICAL_DISPLAY_HEIGHT=64
	-D X_OFF_SET=28
	-D Y_OFF_SET=24
	-D LOGICAL_WIDTH=72
	-D LOGICAL_HEIGHT=40
