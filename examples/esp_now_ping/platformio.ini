; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = native
extra_configs = lib/platformio.ini

; The two C3 environments build the same source. ESP_NOW_NODE_ID is the entire
; difference between the boards: both send and both reply automatically, so the
; id is only the application label in HELLO. src/platforms/esp32_c3.h rejects
; any other value at compile time, so a copy-pasted environment cannot silently
; become a duplicate of the other board's label.
;
; The OLED geometry matches examples/esp_now, examples/esp_now_dice and
; examples/mono_oled: the SSD1306 controller is wired for 128x64, the Beetle's
; 0.42" glass exposes a 72x40 window, and the offset places that window inside
; the framebuffer. The engine draws in LOGICAL_* coordinates and the driver
; applies the offset.

[env:native]
extends = base_native
lib_deps =
	symlink://../../
build_flags =
    ${base_native.build_flags}
    ; Two 72x40 panels side by side, shown at 3x in a 432x120 window. The
    ; geometry lives here, not in the scene, so the two targets cannot disagree
    ; about how much screen a panel has.
	-D PHYSICAL_DISPLAY_WIDTH=432
	-D PHYSICAL_DISPLAY_HEIGHT=120
	-D X_OFF_SET=0
	-D Y_OFF_SET=0
	-D LOGICAL_WIDTH=144
	-D LOGICAL_HEIGHT=40
    -Isrc
    -Iinclude
    -I.pio/libdeps/native/PixelRoot32-Game-Engine/include
    -I.pio/libdeps/native/PixelRoot32-Game-Engine/src
    ; macOS (Homebrew): #include <SDL2/SDL.h> needs the parent include dir
    ; -I/opt/homebrew/include
    ; -L/opt/homebrew/lib
    ; Windows (MSYS2/MinGW) - uncomment on Windows, comment macOS flags above:
    -IC:/msys64/mingw64/include
    -LC:/msys64/mingw64/lib
    -O2
    -Wall
    -Wextra
    -mconsole

; Node A is the first board. Which one is A does not change the protocol.
[env:esp32c3_ping_a]
extends = base_esp32
board = dfrobot_beetle_esp32c3
framework = arduino
lib_deps =
	symlink://../../
build_flags =
	${base_esp32.build_flags}
	-O2
	-Isrc
	-D PLATFORM_ESP32C3
	-D ESP_NOW_NODE_ID=1
	; Selects U8G2_Drawer over the default TFT_eSPI path. PlatformDefaults.h
	; reads this flag and defines PIXELROOT32_USE_U8G2_DRIVER; its #else branch,
	; the only place that would define the TFT_eSPI driver, is skipped.
	-D PIXELROOT32_USE_U8G2
	-D PHYSICAL_DISPLAY_WIDTH=128
	-D PHYSICAL_DISPLAY_HEIGHT=64
	-D X_OFF_SET=28
	-D Y_OFF_SET=24
	-D LOGICAL_WIDTH=72
	-D LOGICAL_HEIGHT=40

; Node B is the second board. It only differs in the label it advertises.
[env:esp32c3_ping_b]
extends = base_esp32
board = dfrobot_beetle_esp32c3
framework = arduino
lib_deps =
	symlink://../../
build_flags =
	${base_esp32.build_flags}
	-O2
	-Isrc
	-D PLATFORM_ESP32C3
	-D ESP_NOW_NODE_ID=2
	-D PIXELROOT32_USE_U8G2
	-D PHYSICAL_DISPLAY_WIDTH=128
	-D PHYSICAL_DISPLAY_HEIGHT=64
	-D X_OFF_SET=28
	-D Y_OFF_SET=24
	-D LOGICAL_WIDTH=72
	-D LOGICAL_HEIGHT=40
