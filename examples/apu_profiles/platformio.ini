; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; APU sound profiles: nine 12-second blocks - simple/medium/complex under
; Legacy/Nes/Hybrid - looping forever, with a serial transcript. On the board the
; I2S DAC drives a speaker and an ILI9341 panel shows the block; on a PC the same
; programme plays through SDL2 and the terminal is the record. See README.md.
;
;   pio run -e esp32dev
;   pio run -e esp32dev --target upload --upload-port COMx
;   pio device monitor --port COMx --baud 115200
;
;   pio run -e native          ; PC build, needs SDL2 (see README)
;   .pio/build/native/program  ; the transcript prints to the terminal

[platformio]
default_envs = esp32dev
extra_configs = lib/platformio.ini

[env:native]
extends = base_native
lib_deps =
	; Same resolution as the board build: the engine's manifest brings the
	; published APU, so this example needs no second entry.
	symlink://../../
build_flags =
    ${base_native.build_flags}
    -Isrc
    -O2
    -Wall
    -Wextra
    -mconsole
    ; Windows (MSYS2/MinGW). CI deletes the two msys64 lines and -mconsole and
    ; builds against libsdl2-dev, so both toolchains use the same configuration.
    -IC:/msys64/mingw64/include
    -LC:/msys64/mingw64/lib

[env:esp32dev]
extends = base_esp32
board = esp32dev
framework = arduino
lib_deps =
	; The engine declares `gperez88/PixelRoot32-APU: ^2.0.0`, so this line is
	; enough: the published APU comes in through the engine's own manifest.
	; To compile against an unreleased APU checkout, add a second entry after
	; this one pointing at it with `symlink://`; README.md, "Trying unreleased
	; APU changes", has the exact two lines.
	symlink://../../
	; TFT_eSPI is a direct dependency here even though the engine pins it: the
	; status panel uses it directly, with no Renderer and no Scene, so the
	; example declares the same source the engine pins rather than relying on a
	; transitive resolve.
	TFT_eSPI=https://github.com/Gperez88/TFT_eSPI.git#master
build_flags =
    ${base_esp32.build_flags}
    ; Panel configuration copied verbatim from the `pong` game's
    ; PLATFORM_ESP32DEV_ILI9341 environment: an ILI9341 240x320 mounted in
    ; portrait and rotated a quarter turn to a 320x240 logical canvas. None of
    ; these pins collide with I2S (BCLK 5, LRCK 21, DOUT 19).
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER
    -D DISPLAY_ROTATION=3
    -D TFT_BACKLIGHT_ON=HIGH
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_BL=16
    -D TFT_MISO=22
    -D TFT_MOSI=23
    -D TFT_SCLK=14
    -D TFT_DC=2
    -D TFT_RST=4
    -D TFT_CS=15
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
    ; `USER_SETUP_LOADED` skips `User_Setup.h`, so the built-in fonts the status
    ; screen draws with have to be requested here or TFT_eSPI compiles them out:
    ; 1 = 8 px (labels), 2 = 16 px (block line), 4 = 26 px letters, scaled in
    ; software for the two large lines. Font 6 is deliberately NOT loaded: it
    ; only contains digits, ':', '-', '.', 'a', 'p', 'm', so `HYBRID` would
    ; render as blanks.
    -D LOAD_GLCD
    -D LOAD_FONT2
    -D LOAD_FONT4
