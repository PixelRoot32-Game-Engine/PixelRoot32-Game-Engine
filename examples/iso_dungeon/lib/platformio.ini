; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; TEMPLATES

[base]
build_unflags =
	-std=gnu++11        ; Remove C++11 standard flag (we use C++17 instead)
build_flags =
    -Wl,--gc-sections
	-std=gnu++17        ; Use GNU C++17 standard
    -fno-exceptions     ; Saves ~15KB Flash (Removes try/catch overhead)
    -D PIXELROOT32_ENABLE_AUDIO=1
    -D PIXELROOT32_ENABLE_PARTICLES=0
    -D PIXELROOT32_ENABLE_PHYSICS=0
    -D PIXELROOT32_ENABLE_UI_SYSTEM=0
    ; The cell-to-screen projection this example is built on. Without it
    ; Projection.h compiles to nothing and the room has no geometry at all.
    -D PIXELROOT32_ENABLE_GAMEPLAY_PROJECTION=1
    ; Depth sorting: what lets the hero pass behind the altar and in front of
    ; it. Off, every entity draws in insertion order and the occlusion is
    ; simply wrong half the time.
    -D PIXELROOT32_ENABLE_DEPTH_SORT=1
    ; Enabled for gameplay::GridMotion, which carries the hero's tile-to-tile
    ; step state. This example declares no GridSpec at all -- its room topology
    ; is a 7x7 char array -- but GridMotion deliberately shares the grid flag
    ; rather than taking one of its own, so an isometric game that wants
    ; cell-to-cell navigation must enable it anyway. GridMotion.h states this
    ; consequence outright; the cost is one unused header, not one unused byte.
    -D PIXELROOT32_ENABLE_GAMEPLAY_GRID_SPACE=1
    ; The art is 4bpp on a custom 16-colour palette. This flag is not
    ; cosmetic: the engine gates its 4bpp draw paths with `if constexpr`, so
    ; building without it is not an error -- it is a black screen.
    -D PIXELROOT32_ENABLE_2BPP_SPRITES=0
    -D PIXELROOT32_ENABLE_4BPP_SPRITES=1
    ; The room is drawn sprite-per-cell because drawTileMap() cannot express a
    ; diamond, so StaticTilemapLayerCache has nothing to cache. These two turn
    ; on the projection-agnostic equivalent: snapshot what the room DREW, and
    ; put it back per dirty cell instead of redrawing 49 tiles.
    ;
    ; Both are needed, and they do different jobs. Without the snapshot the
    ; tiles are redrawn every frame and dirty regions saves only part of the
    ; clear; without dirty regions the snapshot still works but restores the
    ; whole 57,600 B buffer instead of the ~few hundred bytes the hero moved
    ; over. Cost: one logical framebuffer of heap.
    -D PIXELROOT32_ENABLE_STATIC_LAYER_SNAPSHOT=1
    -D PIXELROOT32_ENABLE_DIRTY_REGIONS=1

[base_esp32]
platform = espressif32
monitor_speed = 115200
build_unflags =
	${base.build_unflags}
build_flags =
    ${base.build_flags}
    -Os                  ; Optimize for binary size (useful on ESP32 with limited RAM/Flash)
    -flto                ; Link-Time Optimization (reduces binary size by combining code)
    -fuse-linker-plugin  ; Allows ld to use the LTO plugin; required for RISC-V toolchain
    -ffunction-sections  ; Put each function in its own section; helps remove unused functions (-Wl,--gc-sections)
    -fdata-sections      ; Same as above but for data; helps reduce flash usage
    -fno-lto             ; Disable LTO for problematic objects; prevents "plugin needed to handle lto object" in mixed C/C++ code
    -fno-rtti            ; Remove RTTI support; saves ~20 KB of Flash and RAM

[base_native]
platform = native
build_unflags =
	${base.build_unflags}
	; Apple ld does not support GNU --gc-sections (use -dead_strip instead)
	; -Wl,--gc-sections
build_flags =
    ${base.build_flags}
    -DPLATFORM_NATIVE
    -DSDL_MAIN_HANDLED
    -lSDL2
    ; Apple
    ; -Wl,-dead_strip
