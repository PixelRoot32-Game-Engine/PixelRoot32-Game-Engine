; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = native
extra_configs = lib/platformio.ini

; ---------------------------------------------------------------------------
; A note on the profiling flags below
; ---------------------------------------------------------------------------
; ON for native, commented OUT for esp32dev. That split is deliberate.
;
; A continuously scrolling camera defeats StaticTilemapLayerCache by
; construction — the cache replays a snapshot only while the sampled camera
; position is unchanged, and here it changes every frame. Measuring what that
; costs is half the point of this example, so the instrumentation ships with it.
;
; But the instrumentation is not free on the device: PIXELROOT32_ENABLE_PROFILING
; takes micros() timestamps inside sendBufferScaled's DMA loop, and the debug
; overlay renders text every frame. On a target where the frame budget is
; already 55% consumed by the SPI push, measuring the frame changes the frame.
; So esp32dev ships clean and you uncomment the three lines when you want
; numbers — which is exactly when you accept paying for them.
;
; The numbers themselves arrive over serial once a second, from
; TFT_eSPI_Drawer.cpp:520. See this example's README.

[env:native]
extends = base_native
lib_deps =
	symlink://../../
build_flags =
    ${base_native.build_flags}
    -D PHYSICAL_DISPLAY_WIDTH=240
    -D PHYSICAL_DISPLAY_HEIGHT=240
    -D PIXELROOT32_ENABLE_DEBUG_OVERLAY
    -D PIXELROOT32_ENABLE_PROFILING
    -D PIXELROOT32_DEBUG_MODE
    -Isrc
    -Iinclude
    -I.pio/libdeps/native/PixelRoot32-Game-Engine/include
    -I.pio/libdeps/native/PixelRoot32-Game-Engine/src
    ; macOS (Homebrew): #include <SDL2/SDL.h> needs the parent include dir
    ; -I/opt/homebrew/include
    ; -L/opt/homebrew/lib
    ; Windows (MSYS2/MinGW) — uncomment on Windows, comment macOS flags above:
    -IC:/msys64/mingw64/include
    -LC:/msys64/mingw64/lib
    -O2
    -Wall
    -Wextra
    -mconsole

[env:esp32dev]
extends = base_esp32
board = esp32dev
framework = arduino
lib_deps =
	symlink://../../
build_flags =
    ${base_esp32.build_flags}
    -D PHYSICAL_DISPLAY_WIDTH=240
    -D PHYSICAL_DISPLAY_HEIGHT=240
    -D PLATFORM_ESP32DEV
    -D PIXELROOT32_ENABLE_DEBUG_OVERLAY
    -D PIXELROOT32_ENABLE_PROFILING
    -D PIXELROOT32_DEBUG_MODE
    ; Sends the frame as **12-bit RGB444, two pixels per three bytes**, instead of RGB565. That is a flat **25% reduction in bus time on every frame*
    ; *, independent of scene content — the only lever here that also helps full-screen scrollers.
    ;-D PIXELROOT32_TFT_12BIT_COLOR=1
    ; TFT config (ST7789 240x240)
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_DC=2
    -D TFT_RST=4
    -D TFT_CS=-1
    -D TOUCH_CS=-1
    ; 40 MHz, not 80. At 240x240 RGB565 a full frame is 115,200 bytes, so this
    ; clock puts a hard 23.0 ms floor under every frame — a ~43 FPS ceiling
    ; before the game has done anything at all. That is why this example targets
    ; 30 FPS and not 60. Raising it to 80000000 halves the floor, but the panels
    ; this was developed against do not run reliably at that clock.
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -Isrc
    -O2
