; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Persistence: one settings record and one save slot, printed with their
; StoreResult names on every step. The board stores them in NVS, the PC build in
; save_data/ next to the binary's working directory. See README.md.

[platformio]
default_envs = native
extra_configs = lib/platformio.ini

[env:native]
extends = base_native
lib_deps =
	symlink://../../
build_flags =
    ${base_native.build_flags}
    -D PHYSICAL_DISPLAY_WIDTH=240
    -D PHYSICAL_DISPLAY_HEIGHT=240
    -Isrc
    -Iinclude
    -I.pio/libdeps/native/PixelRoot32-Game-Engine/include
    -I.pio/libdeps/native/PixelRoot32-Game-Engine/src
    -O2
    -Wall
    -Wextra

[env:esp32dev]
extends = base_esp32
board = esp32dev
framework = arduino
lib_deps =
	symlink://../../
build_flags =
    ${base_esp32.build_flags}
    -D PHYSICAL_DISPLAY_WIDTH=240
    -D PHYSICAL_DISPLAY_HEIGHT=240
    -D PLATFORM_ESP32DEV
    ; TFT config (ST7789 240x240)
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_DC=2
    -D TFT_RST=4
    -D TFT_CS=-1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -Isrc
    -O2

; Opt-in microSD build for the CYD (ESP32-2432S028R). Saves move to the card
; at /pr32demo/save/<i>.slot; settings stay in NVS. Insert a FAT32 card.
;
; The panel block is copied from the repository's CYD environment
; (examples/animated_tilemap, env:esp32cyd): an ILI9341_2 240x320 with the
; backlight on GPIO 21 and inversion on. The microSD reader sits on the VSPI
; bus (CS 5, SCK 18, MISO 19, MOSI 23), a different bus from the panel
; (MISO 12, MOSI 13, SCK 14, CS 15, DC 2).
[env:esp32sd]
extends = base_esp32
board = esp32dev
framework = arduino
lib_deps =
	symlink://../../
build_flags =
    ${base_esp32.build_flags}
    -D PHYSICAL_DISPLAY_WIDTH=240
    -D PHYSICAL_DISPLAY_HEIGHT=320
    -D PLATFORM_ESP32CYD
    ; TFT config (ILI9341_2 240x320, CYD ESP32-2432S028R), copied from the
    ; chess game's esp32cyd environment.
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER
    -D TFT_BACKLIGHT_ON=HIGH
    -D TFT_INVERSION_ON
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_BL=21
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_CS=15
    ; The panel must live on HSPI: TFT_eSPI defaults to VSPI, the same host the
    ; microSD uses, and SD.begin() would reconfigure that bus and leave the
    ; panel with no data lines. HSPI keeps the two buses apart.
    -D USE_HSPI_PORT
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
    -D PIXELROOT32_ENABLE_SD_STORAGE=1
    -Isrc
    -O2
