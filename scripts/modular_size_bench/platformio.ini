; Temporary A/B size bench for modular compilation flags (ESP32).
; Used by ../measure_modular_size.py — not a shipped game example.

[platformio]
default_envs = measure_full
extra_configs = lib/platformio.ini

[measure_base]
extends = base_esp32
board = esp32dev
framework = arduino
lib_deps = symlink://../../
build_flags =
    ${base_esp32.build_flags}
    -D PHYSICAL_DISPLAY_WIDTH=128
    -D PHYSICAL_DISPLAY_HEIGHT=128
    -D PLATFORM_ESP32DEV
    -D USER_SETUP_LOADED=1
    -D ST7735_DRIVER
    -D ST7735_GREENTAB3
    -D TFT_WIDTH=128
    -D TFT_HEIGHT=128
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_DC=2
    -D TFT_RST=4
    -D TFT_CS=-1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -Isrc
    -Os

[env:measure_full]
extends = measure_base
build_flags =
    ${measure_base.build_flags}
    -D PIXELROOT32_ENABLE_AUDIO=1
    -D PIXELROOT32_ENABLE_PHYSICS=1
    -D PIXELROOT32_ENABLE_PARTICLES=1
    -D PIXELROOT32_ENABLE_UI_SYSTEM=1

[env:measure_no_audio]
extends = measure_base
build_flags =
    ${measure_base.build_flags}
    -D PIXELROOT32_ENABLE_AUDIO=0
    -D PIXELROOT32_ENABLE_PHYSICS=1
    -D PIXELROOT32_ENABLE_PARTICLES=1
    -D PIXELROOT32_ENABLE_UI_SYSTEM=1

[env:measure_no_physics]
extends = measure_base
build_flags =
    ${measure_base.build_flags}
    -D PIXELROOT32_ENABLE_AUDIO=1
    -D PIXELROOT32_ENABLE_PHYSICS=0
    -D PIXELROOT32_ENABLE_PARTICLES=1
    -D PIXELROOT32_ENABLE_UI_SYSTEM=1

[env:measure_no_ui]
extends = measure_base
build_flags =
    ${measure_base.build_flags}
    -D PIXELROOT32_ENABLE_AUDIO=1
    -D PIXELROOT32_ENABLE_PHYSICS=1
    -D PIXELROOT32_ENABLE_PARTICLES=1
    -D PIXELROOT32_ENABLE_UI_SYSTEM=0

[env:measure_no_particles]
extends = measure_base
build_flags =
    ${measure_base.build_flags}
    -D PIXELROOT32_ENABLE_AUDIO=1
    -D PIXELROOT32_ENABLE_PHYSICS=1
    -D PIXELROOT32_ENABLE_PARTICLES=0
    -D PIXELROOT32_ENABLE_UI_SYSTEM=1

[env:measure_all_off]
extends = measure_base
build_flags =
    ${measure_base.build_flags}
    -D PIXELROOT32_ENABLE_AUDIO=0
    -D PIXELROOT32_ENABLE_PHYSICS=0
    -D PIXELROOT32_ENABLE_PARTICLES=0
    -D PIXELROOT32_ENABLE_UI_SYSTEM=0

[env:measure_sizeof_probe]
extends = env:measure_full
build_flags =
    ${env:measure_full.build_flags}
    -D PIXELROOT32_SIZEOF_PROBE=1
